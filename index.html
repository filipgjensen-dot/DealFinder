<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DealFinder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">Deal<span>Finder</span></div>
  <button id="favBtn">♡ Favoritter <span id="favCount">0</span></button>
</header>

<main>
  <section class="hero">
    <p class="eyebrow">RIGTIGE PRODUKTER · AFFILIATE-KLAR</p>
    <h1>Find det rigtige produkt.<br><span>Til den rigtige pris.</span></h1>
    <p>Søg i rigtige produkter fra Billigelogvvs.dk.</p>
    <div class="search">
      <input id="q" placeholder="Fx Danfoss, Geberit, batteri, lampe...">
      <button id="searchBtn">Søg</button>
    </div>
  </section>

  <section class="filters">
    <select id="category"><option value="">Alle kategorier</option></select>
    <select id="brand"><option value="">Alle brands</option></select>
    <select id="sort">
      <option value="relevance">Mest relevante</option>
      <option value="price_asc">Laveste pris</option>
      <option value="price_desc">Højeste pris</option>
      <option value="name">Navn A-Å</option>
    </select>
  </section>

  <section class="summary">
    <strong id="resultCount">0</strong> produkter fundet
  </section>

  <section id="products" class="grid"></section>

  <div class="pager">
    <button id="prev">← Forrige</button>
    <span id="pageInfo"></span>
    <button id="next">Næste →</button>
  </div>
</main>

<footer>DealFinder V2 · Affiliate-links via Partner-Ads</footer>
<script src="app.js"></script>
</body>
</html>
